<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1123" viewBox="15 -20 1350 1123" font-family="Arial, Helvetica, sans-serif" font-size="18">
<rect x="15" y="-20" width="1350" height="1123" fill="#FFFFFF"/>
<text x="690" y="37" text-anchor="middle" font-weight="bold">FSM-010 — Two-phase tagged transaction context</text>
<rect x="600" y="65" width="180" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="88.5" text-anchor="middle" font-weight="bold">RESET RELEASED</text>
<text x="690" y="110.5" text-anchor="middle" font-weight="bold">Reset đã nhả</text>
<rect x="550" y="155" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="190" text-anchor="middle" font-weight="bold">ST_WAIT_REQ</text>
<text x="690" y="212" text-anchor="middle" font-weight="bold">Wait for request</text>
<text x="690" y="234" text-anchor="middle" font-weight="bold">Chờ request</text>
<rect x="550" y="315" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="350" text-anchor="middle" font-weight="bold">ST_WAIT_SLOT_LINE</text>
<text x="690" y="372" text-anchor="middle" font-weight="bold">READY low until slot and line free</text>
<text x="690" y="394" text-anchor="middle" font-weight="bold">READY thấp khi thiếu slot/line</text>
<rect x="550" y="475" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="510" text-anchor="middle" font-weight="bold">ST_ALLOCATE_CONTEXT</text>
<text x="690" y="532" text-anchor="middle" font-weight="bold">Allocate line lock and slot tag</text>
<text x="690" y="554" text-anchor="middle" font-weight="bold">Initialize phase masks</text>
<rect x="550" y="635" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="670" text-anchor="middle" font-weight="bold">ST_TRACK_PHASE_ACKS</text>
<text x="690" y="692" text-anchor="middle" font-weight="bold">Track phase ACKs by tag</text>
<text x="690" y="714" text-anchor="middle" font-weight="bold">Hold lock and slot until all ACKs</text>
<rect x="550" y="795" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="830" text-anchor="middle" font-weight="bold">ST_WAIT_RESULT</text>
<text x="690" y="852" text-anchor="middle" font-weight="bold">Wait for directory completion</text>
<text x="690" y="874" text-anchor="middle" font-weight="bold">Hold response under backpressure</text>
<rect x="550" y="915" width="280" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="950" text-anchor="middle" font-weight="bold">ST_RELEASE_CONTEXT</text>
<text x="690" y="972" text-anchor="middle" font-weight="bold">Release line lock and tag slot</text>
<text x="690" y="994" text-anchor="middle" font-weight="bold">Only after every phase ACK</text>
<text x="690" y="1057.5" text-anchor="middle">Transaction slots: default 8, range 2–16. Missing phase ACK: no timeout; hold lock/slot until ACK or reset.</text>
