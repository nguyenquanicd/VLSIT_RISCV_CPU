  <rect x="547" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="696.5" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Asynchronous way read</text>
  <line x1="517" y1="534" x2="544" y2="534" stroke="#202020" stroke-width="1.7" />
  <path d="M537 530 L545 534 L537 538 Z" fill="#202020" />
