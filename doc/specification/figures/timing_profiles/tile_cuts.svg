<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="620" viewBox="0 0 1540 620" role="img">
  <title>Profile 1 - Tile cuts</title>
  <desc>Per-router AXI and PMU cuts | 5,843 declared bits at 2 or 4 harts with 16 PMU counters</desc>
  <rect width="1540" height="620" fill="white" />
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="34" font-weight="bold">Profile 1 - Tile cuts</text>
  <text x="32" y="83" font-family="Arial, sans-serif" font-size="22" font-weight="normal">Per-router AXI and PMU cuts | 5,843 declared bits at 2 or 4 harts with 16 PMU counters</text>
  <text x="32" y="113" font-family="Arial, sans-serif" font-size="18" font-weight="normal">REG marks added storage. Double arrows include payload and VALID, with READY in the reverse direction.</text>
  <line x1="32" y1="131" x2="1508" y2="131" stroke="#999999" />
  <text x="32" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Memory AXI</text>
  <rect x="216" y="144" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="332.0" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">CVA6 tile / AXI router</text>
  <text x="332.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Native 64-bit AXI</text>
  <rect x="480" y="144" width="232" height="61" fill="#ececec" stroke="#202020" stroke-width="3" />
  <text x="596.0" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold">REG - tile memory</text>
  <text x="596.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold">AW / W / B / AR / R</text>
  <line x1="450" y1="174" x2="477" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M470 170 L478 174 L470 178 Z" fill="#202020" />
  <path d="M457 170 L449 174 L457 178 Z" fill="#202020" />
  <rect x="744" y="144" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="860.0" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Memory mux + LLC</text>
  <text x="860.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit native</text>
  <line x1="714" y1="174" x2="741" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M734 170 L742 174 L734 178 Z" fill="#202020" />
  <path d="M721 170 L713 174 L721 178 Z" fill="#202020" />
  <rect x="1008" y="144" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1124.0" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">TOP width adapter</text>
  <text x="1124.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64 to D bits</text>
  <line x1="978" y1="174" x2="1005" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M998 170 L1006 174 L998 178 Z" fill="#202020" />
  <path d="M985 170 L977 174 L985 178 Z" fill="#202020" />
  <rect x="1272" y="144" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1388.0" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">SoC memory fabric</text>
  <text x="1388.0" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">D-bit AXI + AWATOP</text>
  <line x1="1242" y1="174" x2="1269" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M1262 170 L1270 174 L1262 178 Z" fill="#202020" />
  <path d="M1249 170 L1241 174 L1249 178 Z" fill="#202020" />
  <text x="216" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Cuts route-to-memory-mux data/VALID, return B/R and reverse READY. TOP memory pins are direct.</text>
  <line x1="32" y1="251" x2="1508" y2="251" stroke="#999999" />
  <text x="32" y="302" font-family="Arial, sans-serif" font-size="19" font-weight="bold">MMIO AXI</text>
  <rect x="216" y="264" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="365.5" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">CVA6 tile / AXI router</text>
  <text x="365.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Native 64-bit AXI</text>
  <rect x="547" y="264" width="299" height="61" fill="#ececec" stroke="#202020" stroke-width="3" />
