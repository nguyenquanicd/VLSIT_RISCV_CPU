  <text x="696.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold">AW / W / B / AR / R</text>
  <line x1="517" y1="294" x2="544" y2="294" stroke="#202020" stroke-width="1.7" />
  <path d="M537 290 L545 294 L537 298 Z" fill="#202020" />
  <path d="M524 290 L516 294 L524 298 Z" fill="#202020" />
  <rect x="878" y="264" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1027.5" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Cluster MMIO mux</text>
  <text x="1027.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit egress</text>
  <line x1="848" y1="294" x2="875" y2="294" stroke="#202020" stroke-width="1.7" />
  <path d="M868 290 L876 294 L868 298 Z" fill="#202020" />
  <path d="M855 290 L847 294 L855 298 Z" fill="#202020" />
  <rect x="1209" y="264" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1358.5" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">SoC peripheral fabric</text>
  <text x="1358.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit AXI</text>
  <line x1="1179" y1="294" x2="1206" y2="294" stroke="#202020" stroke-width="1.7" />
  <path d="M1199 290 L1207 294 L1199 298 Z" fill="#202020" />
  <path d="M1186 290 L1178 294 L1186 298 Z" fill="#202020" />
  <text x="216" y="352" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Cuts route-to-MMIO-mux data/VALID, return B/R and reverse READY. TOP MMIO pins are direct.</text>
  <line x1="32" y1="371" x2="1508" y2="371" stroke="#999999" />
  <text x="32" y="422" font-family="Arial, sans-serif" font-size="19" font-weight="bold">PMU and IRQ</text>
  <rect x="216" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="332.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Events / config</text>
  <rect x="480" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="596.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Aggregate / select</text>
  <line x1="450" y1="414" x2="477" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M470 410 L478 414 L470 418 Z" fill="#202020" />
  <rect x="744" y="384" width="232" height="61" fill="#ececec" stroke="#202020" stroke-width="3" />
  <text x="860.0" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold">REG - count / enable</text>
  <text x="860.0" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold">4 bits per counter</text>
  <line x1="714" y1="414" x2="741" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M734 410 L742 414 L734 418 Z" fill="#202020" />
  <rect x="1008" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1124.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Existing counter bank</text>
  <line x1="978" y1="414" x2="1005" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M998 410 L1006 414 L998 418 Z" fill="#202020" />
  <rect x="1272" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1388.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Wrap / IRQ / CSR</text>
  <line x1="1242" y1="414" x2="1269" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M1262 410 L1270 414 L1262 418 Z" fill="#202020" />
  <text x="216" y="472" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Cuts event select to counter addition. Overflow is direct. Snapshot control adds 3 bits and captures at E+2.</text>
  <line x1="32" y1="491" x2="1508" y2="491" stroke="#999999" />
  <text x="32" y="542" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Directory lookup</text>
  <rect x="216" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
