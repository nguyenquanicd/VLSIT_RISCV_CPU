  <text x="216" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Direct router and TOP connections. External response paths can reach cluster logic in the same cycle.</text>
  <line x1="32" y1="251" x2="1508" y2="251" stroke="#999999" />
  <text x="32" y="302" font-family="Arial, sans-serif" font-size="19" font-weight="bold">MMIO AXI</text>
