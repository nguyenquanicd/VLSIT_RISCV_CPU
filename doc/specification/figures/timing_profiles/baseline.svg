<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="740" viewBox="0 0 1540 740" role="img">
  <title>Profile 0 - Baseline</title>
  <desc>Low-latency reference | 0 additional pipeline state bits</desc>
  <rect width="1540" height="740" fill="white" />
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="34" font-weight="bold">Profile 0 - Baseline</text>
  <text x="32" y="83" font-family="Arial, sans-serif" font-size="22" font-weight="normal">Low-latency reference | 0 additional pipeline state bits</text>
  <text x="32" y="113" font-family="Arial, sans-serif" font-size="18" font-weight="normal">REG marks added storage. Double arrows include payload and VALID, with READY in the reverse direction.</text>
  <line x1="32" y1="131" x2="1508" y2="131" stroke="#999999" />
  <text x="32" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Memory AXI</text>
  <rect x="216" y="144" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="365.5" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">CVA6 tile / AXI router</text>
  <text x="365.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Native 64-bit AXI</text>
  <rect x="547" y="144" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="696.5" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Memory mux + LLC</text>
  <text x="696.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit native</text>
