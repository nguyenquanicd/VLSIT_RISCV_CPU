  <text x="860.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Existing counter bank</text>
  <line x1="714" y1="414" x2="741" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M734 410 L742 414 L734 418 Z" fill="#202020" />
  <rect x="1008" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1124.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Wrap / IRQ logic</text>
  <line x1="978" y1="414" x2="1005" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M998 410 L1006 414 L998 418 Z" fill="#202020" />
  <rect x="1272" y="384" width="232" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1388.0" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Existing CSR status</text>
  <line x1="1242" y1="414" x2="1269" y2="414" stroke="#202020" stroke-width="1.7" />
  <path d="M1262 410 L1270 414 L1262 418 Z" fill="#202020" />
  <text x="216" y="472" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Event selection and counter increment share a cycle. Counter carry feeds the overflow CSR path.</text>
  <line x1="32" y1="491" x2="1508" y2="491" stroke="#999999" />
  <text x="32" y="542" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Directory lookup</text>
  <rect x="216" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="365.5" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">CCU lookup request</text>
  <rect x="547" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="696.5" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Asynchronous way read</text>
  <line x1="517" y1="534" x2="544" y2="534" stroke="#202020" stroke-width="1.7" />
  <path d="M537 530 L545 534 L537 538 Z" fill="#202020" />
  <rect x="878" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1027.5" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Tag compare / victim select</text>
  <line x1="848" y1="534" x2="875" y2="534" stroke="#202020" stroke-width="1.7" />
  <path d="M868 530 L876 534 L868 538 Z" fill="#202020" />
  <rect x="1209" y="504" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1358.5" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Existing response register</text>
  <line x1="1179" y1="534" x2="1206" y2="534" stroke="#202020" stroke-width="1.7" />
  <path d="M1199 530 L1207 534 L1199 538 Z" fill="#202020" />
  <text x="216" y="592" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Array read and comparison share a cycle. The existing response register is the endpoint.</text>
  <line x1="32" y1="611" x2="1508" y2="611" stroke="#999999" />
  <text x="32" y="662" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Reset release</text>
  <rect x="216" y="624" width="590" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="511.0" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">External reset pin</text>
  <rect x="838" y="624" width="590" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1133.0" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Route / adapter / locks / CMO gates</text>
  <line x1="808" y1="654" x2="835" y2="654" stroke="#202020" stroke-width="1.7" />
  <path d="M828 650 L836 654 L828 658 Z" fill="#202020" />
  <text x="216" y="712" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Reset directly qualifies handshake gating. Internal CVA6 paths are common to the three profiles.</text>
