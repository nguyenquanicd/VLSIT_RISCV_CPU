  <text x="420.5" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">CVA6 tile / AXI router</text>
  <text x="420.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Native 64-bit AXI</text>
  <rect x="657" y="264" width="409" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="861.5" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Cluster MMIO mux</text>
  <text x="861.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit egress</text>
  <line x1="627" y1="294" x2="654" y2="294" stroke="#202020" stroke-width="1.7" />
  <path d="M647 290 L655 294 L647 298 Z" fill="#202020" />
