  <text x="1302.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64-bit AXI</text>
  <line x1="1068" y1="294" x2="1095" y2="294" stroke="#202020" stroke-width="1.7" />
  <path d="M1088 290 L1096 294 L1088 298 Z" fill="#202020" />
  <path d="M1075 290 L1067 294 L1075 298 Z" fill="#202020" />
  <text x="216" y="352" font-family="Arial, sans-serif" font-size="18" font-weight="normal">Direct router-to-mux and mux-to-pin connections. Backpressure can propagate through the route.</text>
  <line x1="32" y1="371" x2="1508" y2="371" stroke="#999999" />
  <text x="32" y="422" font-family="Arial, sans-serif" font-size="19" font-weight="bold">PMU and IRQ</text>
