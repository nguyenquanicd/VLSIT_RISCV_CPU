  <path d="M537 170 L545 174 L537 178 Z" fill="#202020" />
  <path d="M524 170 L516 174 L524 178 Z" fill="#202020" />
  <rect x="878" y="144" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1027.5" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">TOP width adapter</text>
  <text x="1027.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">64 to D bits</text>
  <line x1="848" y1="174" x2="875" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M868 170 L876 174 L868 178 Z" fill="#202020" />
  <path d="M855 170 L847 174 L855 178 Z" fill="#202020" />
  <rect x="1209" y="144" width="299" height="61" fill="#ffffff" stroke="#202020" stroke-width="1.5" />
  <text x="1358.5" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">SoC memory fabric</text>
  <text x="1358.5" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">D-bit AXI + AWATOP</text>
  <line x1="1179" y1="174" x2="1206" y2="174" stroke="#202020" stroke-width="1.7" />
  <path d="M1199 170 L1207 174 L1199 178 Z" fill="#202020" />
