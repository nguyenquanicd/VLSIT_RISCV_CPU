<text x="12" y="380" font-size="11" fill="#444">Each column is an abstract event phase, not a clock cycle or latency promise. T0 is only an example winner; round-robin arbitration may select either tag. Both expected slots are reserved in one edge before either PREPARE is issued. T1 owns no partial slot while it waits, so the cross-claim wait cycle cannot form. A missing terminal ACK still retains the winning claim under DEC-018.</text>
