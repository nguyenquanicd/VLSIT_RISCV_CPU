<text x="12" y="380" font-size="11" fill="#444">The cases are independent illustrations, not a time sequence. CACHEABLE uses the shared CCU/LLC path; NORMAL_UNCACHED bypasses LLC allocation; MMIO bypasses CCU/LLC; UNMAPPED or a boundary-crossing span is rejected locally with no downstream request. Route rows are specification-level logical labels, not existing router RTL ports. No cycle latency or AXI response timing is defined by this figure.</text>
