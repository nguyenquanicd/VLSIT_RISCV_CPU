<svg xmlns="http://www.w3.org/2000/svg" width="1967" height="298" viewBox="0 0 1967 298" font-family="Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="12" y="20" font-size="14" font-weight="bold">WF-022 - T1 update blocked, T2 owner cancel escapes (abstract event order)</text>
