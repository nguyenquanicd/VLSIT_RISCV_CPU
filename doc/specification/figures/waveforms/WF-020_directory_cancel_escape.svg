<text x="12" y="320" font-size="11" fill="#444">Abstract ordering only; positions are not RTL cycle or latency promises. T2 first reserves set 5. T1's update belongs to another tag, so it remains VALID while not READY and cannot occupy the arbiter grant. The matching T2 cancel handshakes and releases only the reservation. T1's unchanged update payload then handshakes. These signals identify the current sharer-directory bank-0 ports; reg_dir_resv_valid is internal state. No RTL was changed in this update.</text>
