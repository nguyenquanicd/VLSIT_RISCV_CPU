<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="2290" viewBox="-5 -20 1370 2290" font-family="Arial, Helvetica, sans-serif" font-size="18">
<rect x="-5" y="-20" width="1370" height="2290" fill="#FFFFFF"/>
<text x="690" y="37" text-anchor="middle" font-weight="bold">FSM-003 — Two-phase D-cache probe service</text>
<rect x="600" y="65" width="180" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="88.5" text-anchor="middle" font-weight="bold">RESET RELEASED</text>
<text x="690" y="110.5" text-anchor="middle" font-weight="bold">Reset đã nhả</text>
<rect x="560" y="155" width="260" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="196" text-anchor="middle" font-weight="bold">ST_PROBE_WAIT</text>
<text x="690" y="218" text-anchor="middle" font-weight="bold">Wait for probe / Chờ probe</text>
<rect x="560" y="305" width="260" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="335" text-anchor="middle" font-weight="bold">ST_LOCK_LINE</text>
<text x="690" y="357" text-anchor="middle" font-weight="bold">Block CPU access to line</text>
<text x="690" y="379" text-anchor="middle" font-weight="bold">Drain same-line refill</text>
<rect x="600" y="455" width="180" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="506" text-anchor="middle" font-weight="bold">Line present?</text>
<text x="690" y="528" text-anchor="middle" font-weight="bold">Có line trong cache?</text>
<rect x="80" y="640" width="330" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="245" y="672.5" text-anchor="middle" font-weight="bold">ST_PREPARE_I</text>
<text x="245" y="694.5" text-anchor="middle" font-weight="bold">Line absent: report I/status</text>
<text x="245" y="716.5" text-anchor="middle" font-weight="bold">No payload</text>
<rect x="600" y="640" width="180" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="691" text-anchor="middle" font-weight="bold">State is M?</text>
<text x="690" y="713" text-anchor="middle" font-weight="bold">State hiện tại là M?</text>
<rect x="80" y="835" width="350" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="255" y="875" text-anchor="middle" font-weight="bold">ST_OWNER_WRITEBACK</text>
<text x="255" y="897" text-anchor="middle" font-weight="bold">Write line via flush AXI</text>
<text x="255" y="919" text-anchor="middle" font-weight="bold">Wait B; keep M and lock</text>
<rect x="580" y="1400" width="220" height="115" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="1453.5" text-anchor="middle" font-weight="bold">COMMIT or ABORT?</text>
<text x="690" y="1475.5" text-anchor="middle" font-weight="bold">Line remains locked until command</text>
<rect x="400" y="1810" width="320" height="105" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="560" y="1858.5" text-anchor="middle" font-weight="bold">ST_COMMIT_TO_S</text>
<text x="560" y="1880.5" text-anchor="middle" font-weight="bold">Apply stable state S</text>
<rect x="820" y="1810" width="320" height="105" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="980" y="1858.5" text-anchor="middle" font-weight="bold">ST_COMMIT_TO_I</text>
<text x="980" y="1880.5" text-anchor="middle" font-weight="bold">Apply stable state I</text>
<rect x="560" y="1240" width="260" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="1275" text-anchor="middle" font-weight="bold">ST_PREPARE_ACK</text>
<text x="690" y="1297" text-anchor="middle" font-weight="bold">Return state/status; no data</text>
<text x="690" y="1319" text-anchor="middle" font-weight="bold">Hold MESI/lock until command</text>
<text x="690" y="2212" text-anchor="middle">M PREPARE waits for matching owner B. B error fails PREPARE and triggers ABORT. Probe carries no data; lock stays through COMMIT/ABORT ACK.</text>
<rect x="580" y="1570" width="220" height="115" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="1623.5" text-anchor="middle" font-weight="bold">Target state?</text>
<text x="690" y="1645.5" text-anchor="middle" font-weight="bold">Đích S hay I?</text>
<rect x="60" y="1800" width="300" height="105" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="210" y="1837.5" text-anchor="middle" font-weight="bold">ST_ABORT_ACK</text>
<text x="210" y="1859.5" text-anchor="middle" font-weight="bold">Preserve old MESI state</text>
<text x="210" y="1881.5" text-anchor="middle" font-weight="bold">Unlock after ABORT ACK</text>
<rect x="560" y="2000" width="260" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="690" y="2035" text-anchor="middle" font-weight="bold">ST_COMMIT_ACK</text>
<text x="690" y="2057" text-anchor="middle" font-weight="bold">Return tagged ACK</text>
<text x="690" y="2079" text-anchor="middle" font-weight="bold">Release cache-local lock</text>
