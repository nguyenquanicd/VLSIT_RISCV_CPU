<text x="690" y="1533.5" text-anchor="middle">V2 DRAFT / NHÁP V2: logical ordering only.</text>
<text x="690" y="1555.5" text-anchor="middle">Tag width, zero-target behavior, LLC error recovery and cycle timing are TBD.</text>
